apiVersion: v1
kind: Service
metadata:
  name: {{ include "ibm-custom-ui.fullname" . }}
  labels:
    {{- include "ibm-custom-ui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      name: {{ .Values.service.name }}
  selector:
    {{- include "ibm-custom-ui.selectorLabels" . | nindent 4 }}
